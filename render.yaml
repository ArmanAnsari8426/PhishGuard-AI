# PhishGuard AI - Render Deployment Configuration
services:
  - type: web
    name: phishguard-api
    runtime: python
    buildCommand: pip install -r requirements.txt && cd frontend && npm install && npm run build
    startCommand: gunicorn app:app
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: phishguard-db
          property: connectionString
      - key: VIRUSTOTAL_API_KEY
        sync: false
      - key: GOOGLE_SAFE_BROWSING_API_KEY
        sync: false
    healthCheckPath: /api
    autoDeploy: true

databases:
  - name: phishguard-db
    databaseName: phishguard
    plan: free
